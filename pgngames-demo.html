    <!-- Main Application & Analysis Script -->
    <script>
        // Application State
        let pgnGames = [];
        let currentPgnIndex = 0;
        let mainChess = new Chess();  // Holds official PGN game state
        let activeChess = new Chess(); // Holds live board state (handles analysis moves)
        let mainHistory = [];        // Official moves array
        let currentMoveIndex = -1;  // Pointer in official game moves (-1 = start)
        let board = null;
        let autoplayTimer = null;

        // Analysis State
        let isAnalysisMode = false;
        let analysisMoves = []; // Stores moves made during user analysis

        // Helper to parse multi-game PGN file into individual PGN game strings
        function splitPgnFile(pgnText) {
            const games = [];
            const lines = pgnText.split(/\r?\n/);
            let currentGameLines = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('[Event ')) {
                    if (currentGameLines.length > 0) {
                        games.push(currentGameLines.join('\n').trim());
                        currentGameLines = [];
                    }
                }
                currentGameLines.push(line);
            }
            if (currentGameLines.length > 0) {
                games.push(currentGameLines.join('\n').trim());
            }
            return games.filter(g => g.length > 10);
        }

        // Initialize Chessboard with Drag & Drop Enabled
        function initBoard() {
            board = Chessboard('board', {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });

            // Automatic fluid resize listener
            $(window).on('resize orientationchange', function () {
                if (board) board.resize();
            });
        }

        // Drag Handler: Only allow dragging pieces of the player whose turn it is
        function onDragStart(source, piece, position, orientation) {
            // Do not allow dragging if game is over
            if (activeChess.game_over()) return false;

            // Stop autoplay if user starts dragging a piece
            stopAutoplay();

            // Only pick up pieces for the side to move
            if ((activeChess.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (activeChess.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        // Drop Handler: Validate move in chess.js and trigger Analysis Mode
        function onDrop(source, target) {
            // Check if the move is legal
            const move = activeChess.move({
                from: source,
                to: target,
                promotion: 'q' // Default auto-promote to Queen for simplicity
            });

            // Illegal move
            if (move === null) return 'snapback';

            // Legal Move Executed!
            isAnalysisMode = true;
            analysisMoves.push(move.san);
            updateModeBanner();
            updateAnalysisBox();
            updateButtonStates();
        }

        // SnapEnd Handler: Synchronize board visual FEN with activeChess state
        function onSnapEnd() {
            board.position(activeChess.fen());
        }

        // Load specific PGN game by index
        function loadGame(index) {
            exitAnalysisMode();
            currentPgnIndex = index;
            const pgnString = pgnGames[index];
            if (!pgnString) return;

            mainChess = new Chess();
            const success = mainChess.load_pgn(pgnString);
            if (!success) {
                console.error("Failed to load PGN at index", index);
                return;
            }

            // Update Header Meta
            const headers = mainChess.header();
            document.getElementById("whitePlayer").textContent = headers.White || "White";
            document.getElementById("blackPlayer").textContent = headers.Black || "Black";
            document.getElementById("gameResult").textContent = headers.Result || "*";
            document.getElementById("gameDate").textContent = headers.Date || "N/A";
            document.getElementById("gameSite").textContent = headers.Site || "N/A";
            document.getElementById("gameECO").textContent = headers.ECO ? headers.ECO : "N/A";

            // Extract Move History & Pre-calculate FEN at each step
            mainHistory = mainChess.history({ verbose: true });
            const tempChess = new Chess();
            mainHistory.forEach(m => {
                tempChess.move(m);
                m.fen = tempChess.fen();
            });
            document.getElementById("moveCountBadge").textContent = `${mainHistory.length} moves`;

            // Render Move Notation List
            renderMoveList();

            // Reset to Start Position
            currentMoveIndex = -1;
            updatePosition(false);
        }

        // Render Move History Grid
        function renderMoveList() {
            const container = document.getElementById("movesList");
            container.innerHTML = "";

            for (let i = 0; i < mainHistory.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;

                // Move Number
                const numDiv = document.createElement("div");
                numDiv.className = "move-num";
                numDiv.textContent = `${moveNum}.`;
                container.appendChild(numDiv);

                // White Move
                const whiteMove = mainHistory[i];
                const whiteDiv = document.createElement("div");
                whiteDiv.className = "move-cell";
                whiteDiv.id = `move-${i}`;
                whiteDiv.textContent = whiteMove.san;
                whiteDiv.addEventListener("click", () => goToMove(i));
                container.appendChild(whiteDiv);

                // Black Move (if exists)
                if (i + 1 < mainHistory.length) {
                    const blackMove = mainHistory[i + 1];
                    const blackDiv = document.createElement("div");
                    blackDiv.className = "move-cell";
                    blackDiv.id = `move-${i + 1}`;
                    blackDiv.textContent = blackMove.san;
                    blackDiv.addEventListener("click", () => goToMove(i + 1));
                    container.appendChild(blackDiv);
                } else {
                    const emptyDiv = document.createElement("div");
                    container.appendChild(emptyDiv);
                }
            }
        }

        // Jump to specific move index in main game
        function goToMove(targetIndex) {
            exitAnalysisMode();
            if (targetIndex < -1) targetIndex = -1;
            if (targetIndex >= mainHistory.length) targetIndex = mainHistory.length - 1;

            currentMoveIndex = targetIndex;
            updatePosition(true);
        }

        // Update Board & Active Move Highlight
        function updatePosition(animated = true) {
            let targetFen = 'start';
            if (currentMoveIndex >= 0 && currentMoveIndex < mainHistory.length) {
                targetFen = mainHistory[currentMoveIndex].fen;
            }

            // Sync activeChess with official main game FEN
            activeChess = new Chess(targetFen === 'start' ? 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' : targetFen);
            board.position(targetFen, animated);

            // Update active state in move list
            document.querySelectorAll(".move-cell").forEach(cell => cell.classList.remove("active"));
            if (currentMoveIndex >= 0) {
                const activeCell = document.getElementById(`move-${currentMoveIndex}`);
                if (activeCell) {
                    activeCell.classList.add("active");
                    activeCell.scrollIntoView({ block: "nearest", behavior: "smooth" });
                }
            }

            updateButtonStates();
        }

        // Update button states
        function updateButtonStates() {
            if (isAnalysisMode) {
                document.getElementById("btnStart").disabled = false;
                document.getElementById("btnPrev").disabled = false;
                document.getElementById("btnNext").disabled = true;
                document.getElementById("btnEnd").disabled = true;
            } else {
                document.getElementById("btnStart").disabled = (currentMoveIndex === -1);
                document.getElementById("btnPrev").disabled = (currentMoveIndex === -1);
                document.getElementById("btnNext").disabled = (currentMoveIndex === mainHistory.length - 1);
                document.getElementById("btnEnd").disabled = (currentMoveIndex === mainHistory.length - 1);
            }
        }

        // Mode Banner UI Updates
        function updateModeBanner() {
            const banner = document.getElementById("modeBanner");
            const modeText = document.getElementById("modeText");
            const resetBtn = document.getElementById("btnResetAnalysis");

            if (isAnalysisMode) {
                banner.className = "mode-banner analysis-mode";
                let statusText = `<i class="fas fa-microscope"></i> Analysis Mode (${analysisMoves.length} custom move${analysisMoves.length > 1 ? 's' : ''})`;
                if (activeChess.in_checkmate()) {
                    statusText += " - <strong>Checkmate!</strong>";
                } else if (activeChess.in_draw()) {
                    statusText += " - <strong>Draw!</strong>";
                } else if (activeChess.in_check()) {
                    statusText += " - <strong>Check!</strong>";
                }
                modeText.innerHTML = statusText;
                resetBtn.style.display = "inline-flex";
            } else {
                banner.className = "mode-banner game-line";
                modeText.innerHTML = `<i class="fas fa-book-open"></i> Watching Main Game Line`;
                resetBtn.style.display = "none";
            }
        }

        // Update Trial Variation Box
        function updateAnalysisBox() {
            const box = document.getElementById("analysisBox");
            const textSpan = document.getElementById("analysisMovesText");

            if (isAnalysisMode && analysisMoves.length > 0) {
                box.style.display = "block";
                textSpan.textContent = " " + analysisMoves.join(" ");
            } else {
                box.style.display = "none";
                textSpan.textContent = "";
            }
        }

        // Exit Analysis Mode & Return to Official Game
        function exitAnalysisMode() {
            stopAutoplay();
            isAnalysisMode = false;
            analysisMoves = [];
            updateModeBanner();
            updateAnalysisBox();
            if (board) {
                let targetFen = 'start';
                if (currentMoveIndex >= 0 && currentMoveIndex < mainHistory.length) {
                    targetFen = mainHistory[currentMoveIndex].fen;
                }
                activeChess = new Chess(targetFen === 'start' ? 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1' : targetFen);
                board.position(targetFen, true);
            }
            updateButtonStates();
        }

        // Autoplay Logic
        function toggleAutoplay() {
            if (isAnalysisMode) {
                exitAnalysisMode();
            }
            if (autoplayTimer) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        }

        function startAutoplay() {
            if (currentMoveIndex >= mainHistory.length - 1) {
                currentMoveIndex = -1;
            }
            const speed = parseInt(document.getElementById("autoplaySpeed").value, 10) || 1000;
            const playIcon = document.getElementById("playIcon");
            playIcon.className = "fas fa-pause";

            autoplayTimer = setInterval(() => {
                if (currentMoveIndex < mainHistory.length - 1) {
                    currentMoveIndex++;
                    updatePosition(true);
                } else {
                    stopAutoplay();
                }
            }, speed);
        }

        function stopAutoplay() {
            if (autoplayTimer) {
                clearInterval(autoplayTimer);
                autoplayTimer = null;
            }
            const playIcon = document.getElementById("playIcon");
            if (playIcon) playIcon.className = "fas fa-play";
        }

        // Flip Board
        function flipBoard() {
            board.flip();
        }

        // Fetch & Populate PGN Database
        async function loadPgnFile() {
            try {
                const response = await fetch("./pgn/pgn_games.pgn");
                if (!response.ok) throw new Error("Could not load PGN file");
                const pgnText = await response.text();

                pgnGames = splitPgnFile(pgnText);

                const select = document.getElementById("gameSelect");
                select.innerHTML = "";

                pgnGames.forEach((pgn, idx) => {
                    const tempChess = new Chess();
                    tempChess.load_pgn(pgn);
                    const h = tempChess.header();
                    const title = `${idx + 1}. ${h.White || 'White'} vs ${h.Black || 'Black'} (${h.Event || 'Game'}, ${h.Date || ''}) - ${h.Result || ''}`;

                    const option = document.createElement("option");
                    option.value = idx;
                    option.textContent = title;
                    select.appendChild(option);
                });

                select.addEventListener("change", (e) => {
                    loadGame(parseInt(e.target.value, 10));
                });

                if (pgnGames.length > 0) {
                    loadGame(0);
                }
            } catch (err) {
                console.error(err);
                document.getElementById("gameSelect").innerHTML = "<option>Error loading PGN database.</option>";
            }
        }

        // Setup Event Listeners
        document.addEventListener("DOMContentLoaded", () => {
            initBoard();
            loadPgnFile();

            document.getElementById("btnStart").addEventListener("click", () => {
                if (isAnalysisMode) exitAnalysisMode();
                goToMove(-1);
            });
            document.getElementById("btnPrev").addEventListener("click", () => {
                if (isAnalysisMode) exitAnalysisMode();
                goToMove(currentMoveIndex - 1);
            });
            document.getElementById("btnNext").addEventListener("click", () => {
                if (isAnalysisMode) exitAnalysisMode();
                goToMove(currentMoveIndex + 1);
            });
            document.getElementById("btnEnd").addEventListener("click", () => {
                if (isAnalysisMode) exitAnalysisMode();
                goToMove(mainHistory.length - 1);
            });
            document.getElementById("btnPlay").addEventListener("click", toggleAutoplay);
            document.getElementById("btnFlip").addEventListener("click", flipBoard);
            document.getElementById("btnResetAnalysis").addEventListener("click", exitAnalysisMode);

            // Keyboard navigation
            document.addEventListener("keydown", (e) => {
                // Ignore key events when user is focusing input/select
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    if (isAnalysisMode) exitAnalysisMode();
                    goToMove(currentMoveIndex - 1);
                } else if (e.key === "ArrowRight") {
                    e.preventDefault();
                    if (isAnalysisMode) exitAnalysisMode();
                    goToMove(currentMoveIndex + 1);
                } else if (e.key === " ") {
                    e.preventDefault();
                    toggleAutoplay();
                } else if (e.key === "Home") {
                    e.preventDefault();
                    if (isAnalysisMode) exitAnalysisMode();
                    goToMove(-1);
                } else if (e.key === "End") {
                    e.preventDefault();
                    if (isAnalysisMode) exitAnalysisMode();
                    goToMove(mainHistory.length - 1);
                }
            });
        });
    </script>
</body>

</html>
